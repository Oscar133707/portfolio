<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Webbutvecklare & AI-Specialist | Portfolio</title>
    
    <meta name="theme-color" content="#0B0D12" />
    <meta name="color-scheme" content="dark" />

    <!-- Google Fonts: Bricolage Grotesque (display), Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      /* Colours are channel triplets defined in index.css (:root) so opacity
         modifiers like bg-accent/20 keep working on top of CSS variables. */
      const token = (name) => `rgb(var(--c-${name}) / <alpha-value>)`;
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['"Bricolage Grotesque"', 'Inter', 'sans-serif'],
            },
            colors: {
              bas: token('bas'),
              'bas-djup': token('bas-djup'),
              yta: token('yta'),
              'yta-hog': token('yta-hog'),
              fg: token('fg'),
              dump: token('dump'),
              'dump-svag': token('dump-svag'),
              linje: token('linje'),
              accent: token('accent'),
              'accent-ljus': token('accent-ljus'),
              guld: token('guld'),
            },
            boxShadow: {
              upphojd: 'var(--shadow-upphojd)',
              svavande: 'var(--shadow-svavande)',
            },
            transitionTimingFunction: {
              mjuk: 'var(--ease-mjuk)',
              fjader: 'var(--ease-fjader)',
              panel: 'var(--ease-panel)',
            },
          }
        },
        plugins: [
          /* Only apply hover:/group-hover: styles on devices with a real mouse —
             prevents "stuck" hover effects lingering after a tap on touch screens. */
          function ({ addVariant }) {
            addVariant('hover', '@media (hover: hover) { &:hover }');
            addVariant('group-hover', '@media (hover: hover) { :merge(.group):hover & }');
          },
        ],
      }
    </script>
    <style>
      /* Custom scrollbar — subtle, matches the dark ink base */
      ::-webkit-scrollbar {
        width: 9px;
      }
      ::-webkit-scrollbar-track {
        background: #0B0D12;
      }
      ::-webkit-scrollbar-thumb {
        background: #262B38;
        border-radius: 6px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3A4152;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",

    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "react-hook-form": "https://esm.sh/react-hook-form@^7.69.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
  <script>
    /* Set a stable full-height once at load — window.innerHeight never changes due to toolbar */
    document.documentElement.style.setProperty('--full-height', window.innerHeight + 'px');
  </script>
  <script>
    /* VisualViewport scroll compensator for Instagram WebView toolbar hop */
    (function () {
      if (!window.visualViewport) return;
      if (!/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) return; /* Mobile only */
      var last = window.visualViewport.height;
      window.visualViewport.addEventListener('resize', function () {
        /* Skip when virtual keyboard is active (form field focused) */
        var active = document.activeElement;
        if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
        if (document.body.style.overflow === 'hidden') return; /* Menyn är öppen */
        var now = window.visualViewport.height;
        var diff = last - now;
        last = now;
        /* Only toolbar-range changes (5–120px); full keyboard is ~300px */
        if (Math.abs(diff) > 5 && Math.abs(diff) < 120) {
          window.scrollBy({ top: -diff, behavior: 'instant' });
        }
      });
    })();
  </script>
</head>
  <body class="bg-bas text-fg antialiased selection:bg-accent selection:text-white">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
